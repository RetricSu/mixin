[package]
name = "mixin"
version = "0.2.0"
edition = "2021"
description = "密信：两台电脑之间传一句秘密"
publish = false

[package.metadata.bundle]
name = "Mixin"
identifier = "com.retric.mixin"
icon = ["assets/icons/32x32.png", "assets/icons/128x128.png", "assets/icons/256x256.png", "assets/icons/512x512.png", "assets/icons/icon.icns", "assets/icons/icon.ico"]
version = "0.2.0"
copyright = "© 2025 RetricSu"
category = "Utility"
short_description = "两台电脑之间传一句秘密"
long_description = "密信：给普通人用的桌面端对端安全传递工具"
deb_depends = ["libgtk-3-0"]

[package.metadata.bundle.osx]
minimum_system_version = "10.14"

[dependencies]
argon2 = "0.5"
aes-gcm = "0.10"
sha2 = "0.10"
rand = "0.8"
base64 = "0.22"
rpassword = "7"
eframe = "0.29"
rfd = "0.15"
ed25519-dalek = { version = "2", features = ["rand_core"] }
x25519-dalek = { version = "2", features = ["static_secrets"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"
qrcode = "0.14"
arboard = "3"
image = { version = "0.25", default-features = false, features = ["png"] }
hkdf = "0.12"

[profile.release]
lto = true
opt-level = "z"
strip = true
panic = "abort"
codegen-units = 1
