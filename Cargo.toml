[package]
name = "mixin"
version = "0.1.0"
edition = "2021"
description = "密信：两台电脑之间传一句秘密"
publish = false

[dependencies]
aes-gcm = "0.10"
sha2 = "0.10"
rand = "0.8"
base64 = "0.22"
eframe = "0.35"
arboard = "3"

[profile.release]
lto = true
opt-level = "z"
strip = true
panic = "abort"
codegen-units = 1
