[package]
name = "mixin"
version = "0.1.0"
edition = "2021"
description = "密信：两台电脑之间传一句秘密"
publish = false

[dependencies]
aes-gcm = "0.10"
sha2 = "0.10"
rand = "0.8"
base64 = "0.22"
rpassword = "7"
eframe = "0.29"
rfd = "0.15"
rsa = { version = "0.9", features = ["sha2", "pem"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"
qrcode = "0.14"
arboard = "3"
image = { version = "0.25", default-features = false, features = ["png"] }

[profile.release]
lto = true
opt-level = "z"
strip = true
panic = "abort"
codegen-units = 1
